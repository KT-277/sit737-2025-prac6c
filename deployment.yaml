apiVersion: apps/v1
kind: Deployment
metadata:
  name: sit737-6-1p-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sit737-6-1p-app
  template:
    metadata:
      labels:
        app: sit737-6-1p-app
    spec:
      containers:
      - name: sit737-6-1p-app
        image: krishi277/sit737-6-1p-app:v2
        ports:
        - containerPort: 8080